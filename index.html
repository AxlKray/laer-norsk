    <p class="muted">Benutze zum Beispiel: ${hints.map(esc).join(", ")}</p>
    <textarea class="ans" id="fw" spellcheck="false" placeholder="Skriv på norsk …"></textarea>
    <div class="keys"><button data-k="æ">æ</button><button data-k="ø">ø</button><button data-k="å">å</button><span>Norwegische Buchstaben</span></div>
    <div class="row"><button class="btn primary" id="fw-go">Korrigieren lassen</button><button class="btn" id="fw-back">Zurück</button></div>
    <div id="fw-out"></div></div>
    <div class="side"><div class="panel"><h4>So bewertet Ingrid</h4><p class="note" style="margin:0">0–10 Punkte für Verständlichkeit, Grammatik, Wortschatz und Rechtschreibung auf Niveau ${state.level}.</p></div></div></div>`;
  const ta=$("#fw");
  pane.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const s=ta.selectionStart; ta.value=ta.value.slice(0,s)+k.dataset.k+ta.value.slice(ta.selectionEnd); ta.focus(); ta.setSelectionRange(s+1,s+1) });
  $("#fw-back").onclick=()=>renderStart(pane,"train","written");
  $("#fw-go").onclick=async()=>{
    const txt=ta.value.trim(); if(txt.length<5){ ta.focus(); return }
    const b=$("#fw-go"), out=$("#fw-out"); b.disabled=true; b.classList.add("spin"); out.innerHTML="";
    try{
      const r = await sample.json(`Du bist Ingrid, Norwegischlehrerin für Deutschsprachige. Korrigiere diesen norwegischen (Bokmål) Text eines Lernenden auf Niveau ${state.level} zum Thema „${t.de}“.
Text:
"""${txt.slice(0,3000)}"""
Antworte nur mit JSON: {"score":0-10,"corrected":"vollständig korrigierter Text auf Norwegisch","errors":[{"wrong":"falsch","right":"richtig","why":"kurze Erklärung auf Deutsch"}],"praise":"1 Satz Lob auf Deutsch","next":"1 konkreter Tipp auf Deutsch"}
Höchstens 6 errors, die wichtigsten zuerst. Bewerte fair für das Niveau.`,{cache:false});
      const errs=(r.errors||[]).slice(0,6);
      out.innerHTML=`<div class="fb ${r.score>=8?"ok":r.score>=5?"almost":"no"}"><div class="h">${Number(r.score)||0} / 10 Punkte</div>
        <div class="muted">${esc(r.praise||"")}</div>
        <span class="label" style="margin-top:6px">Korrigiert</span><div class="sol" style="font-size:18px">${esc(r.corrected||"")} <button class="icon" id="fw-say">${ICON.play}</button></div>
        ${errs.length?`<span class="label" style="margin-top:6px">Fehler</span><div class="review">${errs.map(e=>`<div><span class="m no">✗</span><span><s>${esc(e.wrong||"")}</s> → <b>${esc(e.right||"")}</b><br><span class="muted">${esc(e.why||"")}</span></span></div>`).join("")}</div>`:""}
        ${r.next?`<div style="margin-top:6px"><b>Nächster Schritt:</b> ${esc(r.next)}</div>`:""}</div>`;
      const fs=$("#fw-say"); if(fs) fs.onclick=()=>speak(r.corrected||"");
      const p=getProg(state.topic); p.trained++; if((r.score||0)>=5) p.right++; saveProg(state.topic,p);
    }catch(e){ out.innerHTML=`<p class="note">${esc(e.code==="invalid_json"?"Die Korrektur kam unvollständig an – bitte noch einmal.":aiErr(e))}</p>` }
    b.disabled=false; b.classList.remove("spin");
  };
}

/* ---------------- Chat with Ingrid ---------------- */
let chatMode="role"; const chats={};
function chatRules(t){
  const base=`Du bist Ingrid, eine geduldige, freundliche Norwegischlehrerin aus Bergen. Dein Schüler spricht Deutsch und lernt Norwegisch (Bokmål) auf Niveau ${LEVEL_DESC[state.level]}. Thema der Stunde: „${t.de}“.`;
  if(chatMode==="role") return base+`
Wir machen ein Rollenspiel/Gespräch auf Norwegisch zum Thema. Regeln für JEDE deiner Antworten, genau in diesem Format, ohne Markdown:
NO: deine Antwort auf Norwegisch (1–3 kurze Sätze, Wortschatz und Grammatik streng passend zum Niveau, endet meist mit einer Frage an den Schüler)
DE: deutsche Übersetzung davon
KORREKTUR: falls die letzte Nachricht des Schülers Fehler enthielt: korrigierte Fassung + ganz kurze Erklärung auf Deutsch. Wenn fehlerfrei: "Alles richtig!" Beim allerersten Beitrag diese Zeile weglassen.
Wenn der Schüler auf Deutsch schreibt, hilf ihm, es auf Norwegisch zu sagen.`;
  return base+`
Der Schüler stellt Fragen zu Grammatik, Wörtern, Aussprache oder Kultur. Antworte auf Deutsch, kurz und klar (max. 120 Wörter), mit norwegischen Beispielen, die du in Anführungszeichen setzt. Kein Markdown.`;
}
function renderChat(pane,id,set,t){
  const key=id+":"+state.level+":"+chatMode; chats[key]=chats[key]||[];
  const turns=chats[key];
  pane.innerHTML=`<div class="stage"><div class="card">
    <div class="modes"><button class="btn sm ${chatMode==="role"?"primary":""}" data-m="role">Gespräch auf Norwegisch</button><button class="btn sm ${chatMode==="ask"?"primary":""}" data-m="ask">Fragen auf Deutsch</button></div>
    <div class="chat" id="log" aria-live="polite"></div>
    <div class="keys"><button data-k="æ">æ</button><button data-k="ø">ø</button><button data-k="å">å</button>${srOK?`<button class="icon" id="cmic" aria-label="Einsprechen" style="width:36px;height:36px">${ICON.mic}</button>`:""}<span id="cnote"></span></div>
    <div class="chat-in"><textarea class="ans" id="cin" rows="1" placeholder="${chatMode==="role"?"Svar på norsk …":"Deine Frage …"}"></textarea><button class="btn primary" id="csend">Senden</button></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="creset">Neu anfangen</button></div>
  </div>
  <div class="side"><div class="panel"><h4>${chatMode==="role"?"Gespräch":"Fragen"}</h4><p class="note" style="margin:0">${chatMode==="role"?"Ingrid schreibt auf Norwegisch, darunter die Übersetzung. Deine Fehler korrigiert sie in jeder Antwort.":"Frag z. B.: „Wann sagt man ei und wann en?“ oder „Wie spricht man kj aus?“"}</p></div>
  <div class="panel"><h4>Wörter zum Thema</h4><div class="chips">${set?set.v.slice(0,10).map(x=>`<span class="chip">${esc(first(x.no))}</span>`).join(""):""}</div></div></div></div>`;
  const log=$("#log"), cin=$("#cin");
  pane.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ chatMode=b.dataset.m; renderChat(pane,id,set,t) });
  pane.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const s=cin.selectionStart; cin.value=cin.value.slice(0,s)+k.dataset.k+cin.value.slice(cin.selectionEnd); cin.focus(); cin.setSelectionRange(s+1,s+1) });
  $("#creset").onclick=()=>{ chats[key]=[]; renderChat(pane,id,set,t) };
  function bubble(role,text){
    const d=document.createElement("div"); d.className="msg "+(role==="user"?"me":"bot");
    if(role==="user"){ d.textContent=text } else fillBot(d,text);
    log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }
  function fillBot(d,text){
    if(chatMode!=="role"){ d.textContent=text; return }
    const no=(text.match(/NO:\s*([\s\S]*?)(?=\n\s*DE:|$)/)||[])[1]; const de=(text.match(/DE:\s*([\s\S]*?)(?=\n\s*KORREKTUR:|$)/)||[])[1]; const fx=(text.match(/KORREKTUR:\s*([\s\S]*)$/)||[])[1];
    if(!no){ d.textContent=text; return }
    d.innerHTML=`<div class="no-line"></div>${de?'<div class="de-line"></div>':""}${fx?'<div class="fix-line"></div>':""}<div class="say"><button class="icon" style="width:30px;height:30px" aria-label="Anhören">${ICON.play}</button></div>`;
    d.querySelector(".no-line").textContent=no.trim(); if(de) d.querySelector(".de-line").textContent=de.trim(); if(fx) d.querySelector(".fix-line").textContent="Korrektur: "+fx.trim();
    d.querySelector(".say button").onclick=()=>speak(no.trim());
  }
  turns.forEach(x=>bubble(x.role,x.content));
  let busy=false, ctl=null;
  async function ask(userText){
    if(busy) return; busy=true; $("#csend").disabled=true;
    if(userText){ turns.push({role:"user",content:userText}); bubble("user",userText) }
    const d=bubble("assistant","…"); d.classList.add("spin");
    const msgs=[{role:"user",content:chatRules(t)+(turns.length?"":"\nBeginne jetzt das Gespräch mit einer Begrüßung und einer ersten einfachen Frage zum Thema.")},...turns.slice(-16)];
    if(msgs[msgs.length-1].role!=="user") msgs.push({role:"user",content:"(weiter)"});
    ctl=new AbortController();
    try{
      const {text}=await sample(msgs,{cache:false,signal:ctl.signal,modelTier:"quick",onText:({text})=>{ d.classList.remove("spin"); fillBot(d,text); log.scrollTop=log.scrollHeight }});
      d.classList.remove("spin"); fillBot(d,text); turns.push({role:"assistant",content:text});
      if(chatMode==="role"){ const no=(text.match(/NO:\s*([\s\S]*?)(?=\n\s*DE:|$)/)||[])[1]; if(no) speak(no.trim()) }
    }catch(e){ d.classList.remove("spin"); d.textContent=aiErr(e)||"Abgebrochen."; if(userText) turns.pop() }
    busy=false; const s=$("#csend"); if(s) s.disabled=false;
  }
  const send=()=>{ const v=cin.value.trim(); if(!v) return; cin.value=""; ask(v) };
  $("#csend").onclick=send; cin.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send() } };
  const mic=$("#cmic"); if(mic) mic.onclick=async()=>{ mic.disabled=true; $("#cnote").textContent="Ich höre zu …";
    try{ const a=await listenOnce(); cin.value=a[0]; $("#cnote").textContent="Prüfen und senden."; cin.focus() }
    catch(err){ if(["not-allowed","service-not-allowed","audio-capture","unavailable","network"].includes(err)){ srOK=false; mic.remove(); $("#cnote").textContent="Mikrofon hier nicht verfügbar – bitte tippen." } else $("#cnote").textContent="Nichts verstanden." }
    if(mic.isConnected) mic.disabled=false };
  if(!turns.length && chatMode==="role" && sample) ask(null);
  else if(!turns.length){ const d=document.createElement("div"); d.className="msg bot"; d.textContent="Hei! Was möchtest du über Norwegisch wissen?"; log.appendChild(d) }
}

document.getElementById("snd-btn").onclick=()=>{ SND.on=!SND.on; store.set("sound",SND.on); drawSndBtn(); if(SND.on) SND.ok() };
document.getElementById("tut-btn").innerHTML=ICON.help+"<span>Tutorial</span>";
document.getElementById("tut-btn").onclick=openTutorial;
drawSndBtn();
render();
</script>

<script>if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(()=>{}) }</script>
</body></html>
