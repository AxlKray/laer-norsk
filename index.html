<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lær norsk"><meta name="theme-color" content="#1E4D5C">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lær norsk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a single study desk — header bar, topic grid, then one focused exercise card at a time */
:root{
  --bg:#EDF1EF; --surface:#FBFCFB; --ink:#14232A; --muted:#5A696D; --line:#D3DBD9;
  --accent:#B92B33; --fjord:#1E4D5C; --fjord-soft:#DCE8EA;
  --good:#2E7A4E; --good-soft:#E0F0E6; --warn:#A85E16; --warn-soft:#F6EAD8; --bad:#B42F36; --bad-soft:#F6E0E1;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F181C; --surface:#16232A; --ink:#E5EDED; --muted:#99A9AC; --line:#2A3B42;
  --accent:#E8666C; --fjord:#86BCCB; --fjord-soft:#1C3640;
  --good:#71C590; --good-soft:#17322A; --warn:#E3A461; --warn-soft:#3A2C1B; --bad:#EE7B80; --bad-soft:#3A1F23; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F181C; --surface:#16232A; --ink:#E5EDED; --muted:#99A9AC; --line:#2A3B42;
  --accent:#E8666C; --fjord:#86BCCB; --fjord-soft:#1C3640;
  --good:#71C590; --good-soft:#17322A; --warn:#E3A461; --warn-soft:#3A2C1B; --bad:#EE7B80; --bad-soft:#3A1F23; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--fjord);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand h1{font-size:34px;line-height:1}
.brand h1 .ae{color:var(--accent)}
.brand small{color:var(--muted);font-size:14px}
.levels{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.levels button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--fjord);color:var(--surface)}
.levels button span{font-weight:400;font-size:12px;margin-left:4px}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin:26px 0 22px}
.intro h2{font-size:30px;line-height:1.15}
.intro p{margin:8px 0 0;max-width:60ch;color:var(--muted)}
.wotd{background:var(--fjord-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wotd .no{font-family:var(--display);font-size:28px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.topic:hover{border-color:var(--fjord);transform:translateY(-1px)}
.topic .tno{font-family:var(--display);font-size:24px;line-height:1.1}
.topic .tde{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.g{background:var(--good-soft);color:var(--good)}
.topic.add{border-style:dashed;justify-content:center;color:var(--muted)}
.topic.add .tno{color:var(--ink)}

/* topic view */
.crumbs{display:flex;align-items:center;gap:10px;margin:22px 0 6px;flex-wrap:wrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.thead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.thead h2{font-size:38px;line-height:1.05}
.thead .sub{color:var(--muted)}
.tabs-wrap{overflow-x:auto;margin:0 -4px 18px;padding:0 4px}
.tabs{display:flex;gap:6px;min-width:max-content;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .grp{font-weight:400;opacity:.8}
.tip{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:15px;margin-bottom:16px}
.tip b{color:var(--warn)}

/* learn */
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 8px;flex-wrap:wrap}
.sec-h h3{font-size:22px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.vrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.vrow .t{min-width:0;flex:1}
.vrow .n{font-weight:700;font-size:17px}
.vrow .d{color:var(--muted);font-size:14px}
.plist{display:flex;flex-direction:column;gap:8px}
.plist .vrow .n{font-weight:400;font-family:var(--display);font-size:19px}
.icon{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:inline-grid;place-items:center;color:var(--fjord)}
.icon svg{width:18px;height:18px}
.icon:hover{border-color:var(--fjord)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--fjord)}
.btn.primary{background:var(--fjord);border-color:var(--fjord);color:var(--surface)}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* exercise */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card .kind{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.prompt{font-family:var(--display);font-size:30px;line-height:1.2;margin:4px 0 18px;overflow-wrap:anywhere}
.prompt.small{font-size:22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;text-align:left;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--fjord)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.sel{border-color:var(--fjord);background:var(--fjord-soft)}
input.ans,textarea.ans{width:100%;box-sizing:border-box;font:inherit;font-size:19px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea.ans{font-size:17px;min-height:120px;resize:vertical}
.keys{display:flex;gap:6px;margin:8px 0 14px;flex-wrap:wrap;align-items:center}
.keys button{width:40px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:18px}
.keys span{font-size:13px;color:var(--muted);margin-left:4px}
.built{min-height:52px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;background:var(--bg)}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.word{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:17px}
.word.used{visibility:hidden}
.play-big{display:flex;gap:10px;align-items:center;margin:4px 0 18px;flex-wrap:wrap}
.play-big .icon{width:56px;height:56px;background:var(--fjord);color:var(--surface);border:0}
.play-big .icon svg{width:24px;height:24px}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft)} .fb.ok .h{color:var(--good)}
.fb.almost{background:var(--warn-soft)} .fb.almost .h{color:var(--warn)}
.fb.no{background:var(--bad-soft)} .fb.no .h{color:var(--bad)}
.fb .h{font-weight:700}
.fb .sol{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-out{font-size:15px;white-space:pre-wrap;border-left:3px solid var(--fjord);padding-left:10px;margin-top:4px}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--fjord);transition:width .3s}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dots i{width:16px;height:16px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.dots i.cur{border-color:var(--fjord);border-width:2px}
.dots i.done{background:var(--fjord-soft)}

/* results */
.result-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.grade{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--fjord);color:var(--surface);font-family:var(--display);font-size:48px;flex:none}
.review{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.review div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:15px}
.review .m{font-weight:700}
.review .m.ok{color:var(--good)} .review .m.no{color:var(--bad)} .review .m.almost{color:var(--warn)}
table.scale{border-collapse:collapse;font-size:13px;margin-top:6px;width:100%}
table.scale td{padding:2px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

/* start screens */
.starter{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.starter .panel{display:flex;flex-direction:column;gap:8px}
.starter .panel h3{font-size:22px}
.starter .panel p{margin:0;color:var(--muted);font-size:15px;flex:1}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:60vh;overflow-y:auto;padding:4px 2px 10px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--fjord);color:var(--surface);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .no-line{font-size:17px}
.msg .de-line{color:var(--muted);font-size:14px;margin-top:4px}
.msg .fix-line{color:var(--warn);font-size:14px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.msg .say{margin-top:6px}
.chat-in{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{flex:1;min-width:0;min-height:48px;max-height:140px;font-size:16px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.ai-only{display:none}
body.has-ai .ai-only{display:revert}
body.has-ai .no-ai{display:none}
.spin::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.modal{position:fixed;inset:0;background:rgba(10,20,24,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{width:min(440px,100%)}


/* map */
.mapbox{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:8px}
.mapwrap{min-width:0}
.map{width:100%;max-width:380px;height:auto;display:block;background:var(--fjord-soft);border-radius:10px}
.map path{fill:var(--surface);stroke:var(--fjord);stroke-width:1;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.map path:hover{fill:var(--warn-soft)}
.map path:focus-visible{outline:none;stroke:var(--accent);stroke-width:2.5}
.map path.sel{fill:var(--accent)}
.map path.right{fill:var(--good)}
.map path.wrong{fill:var(--bad)}
.map .cities circle{fill:var(--ink)}
.map text{font-family:var(--body);pointer-events:none}
.map .city{font-size:8.5px;fill:var(--muted)}
.map .rl{font-family:var(--display);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.mapinfo{min-width:0}
.mchips{margin-top:14px}
.calcbox{grid-template-columns:1fr}
.calc-q{display:flex;align-items:center;gap:14px;margin:10px 0 2px;font-family:var(--display);font-size:44px;font-variant-numeric:tabular-nums}
.mchip{border:1px solid var(--line);cursor:pointer;font-size:13px;padding:4px 10px}
.mchip:hover{border-color:var(--fjord)}
.mchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (max-width:720px){.mapbox{grid-template-columns:1fr}}

/* grammar */
.gcard{background:var(--fjord-soft);border-color:transparent}
.gcard .tno{font-size:21px}
.gcard.dim{opacity:.7}
.gintro{max-width:68ch}
.gintro p{margin:0 0 10px}
.tablewrap{overflow-x:auto;margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.gt{border-collapse:collapse;width:100%;font-size:15px}
table.gt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.gt td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.gt tr:last-child td{border-bottom:0}
table.vt td{white-space:nowrap}
.gap{display:inline-block;min-width:3.2em;height:.9em;border-bottom:3px solid var(--accent);margin:0 .12em;vertical-align:baseline}

/* header actions */
.hdr-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink)}
.hbtn:hover{border-color:var(--fjord)}
#snd-btn{padding:0}
/* learning path */
.pathsec{margin:22px 0 10px}
.path-head{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.ph-main h2{font-size:32px;line-height:1.1;margin-top:4px}
.btn.big{padding:12px 22px;font-size:16px;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.btn.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.btn svg{vertical-align:-4px}
.pstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pstat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pstat .fl{color:var(--warn);display:inline-flex} .pstat .xp{color:var(--fjord);display:inline-flex}
.ptabs{display:flex;gap:6px;margin:22px 0 4px;border-bottom:1px solid var(--line)}
.ptabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:16px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.ptabs button span{font-weight:400;font-size:13px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pathline{max-width:520px;margin:0 auto}
.unit{margin:22px 0 6px}
.ubanner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ubanner .ulvl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.ubanner .uno{font-family:var(--display);font-size:22px;line-height:1.15}
.ubanner .ude{font-size:14px;opacity:.85}
.ubanner .ucnt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ubanner.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.ubanner.done{background:var(--fjord);border-color:var(--fjord);color:var(--surface)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:40px;padding:48px 0 18px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px}
.node button{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s}
.node button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.node.locked button{background:var(--line);color:var(--muted);box-shadow:0 5px 0 rgba(0,0,0,.08)}
.node.done button{background:var(--fjord);color:var(--surface)}
.node.cur button{background:var(--accent);color:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.2),0 0 0 0 var(--warn-soft)}50%{box-shadow:0 5px 0 rgba(0,0,0,.2),0 0 0 10px var(--warn-soft)}}
.node .nl{font-size:13px;color:var(--muted);font-weight:700}
.node.cur .nl{color:var(--accent)}
.stars{display:flex;gap:1px;color:var(--line)} .stars i{display:inline-flex} .stars i.on{color:var(--warn)}
.bubble{position:absolute;top:-30px;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font-weight:700;padding:2px 10px;border-radius:8px;font-size:13px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ptoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(440px,calc(100% - 32px));z-index:25;font-size:15px}
.free-h{margin:44px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.free-h h2{font-size:28px}
.free-h p{margin:6px 0 0;max-width:65ch}
/* lesson */
.lesson{max-width:720px;margin:18px auto 0}
.ltop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lx{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.lbar{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--good);border-radius:7px;transition:width .35s}
.lhead{margin-bottom:10px}
.lcard{min-height:320px}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:10px;padding:12px;font-size:16px;text-align:center;overflow-wrap:anywhere}
.mbtn:hover:not(:disabled){border-color:var(--fjord)}
.mbtn.sel{border-color:var(--fjord);background:var(--fjord-soft)}
.mbtn.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);opacity:.7}
.mbtn.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.lfinish{text-align:center;padding:10px 0}
.lfinish h2{font-size:34px;margin:12px 0 4px}
.bigstars{display:flex;justify-content:center;gap:8px;margin:12px 0;color:var(--line)}
.bigstars i{display:inline-flex} .bigstars svg{width:46px;height:46px} .bigstars i.on{color:var(--warn);animation:pop .5s both}
.bigstars i.on:nth-child(2){animation-delay:.15s} .bigstars i.on:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.fstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px auto 0;max-width:520px}
.fstats div{background:var(--bg);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column}
.fstats b{font-family:var(--display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.fstats span{font-size:12px;color:var(--muted)}
.btn.auto{position:relative;overflow:hidden}
.btn.auto::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:currentColor;opacity:.55;animation:autofill var(--auto-ms,2.5s) linear forwards}
@keyframes autofill{to{width:100%}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
/* tutorial */
.tut{width:min(520px,100%)}
.tut h3{font-size:26px;margin:10px 0 8px}
.tut p{margin:0 0 16px;font-size:16px;line-height:1.55}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--line)} .tdots i.on{background:var(--accent);width:22px;border-radius:4px}

  .brand small{display:none}
}

function dupOf(name){ const n=String(name||"").trim().toLowerCase(); return Object.keys(TOPICS).find(k=>TOPICS[k].no.toLowerCase()===n||TOPICS[k].de.toLowerCase()===n) }

function topicMeta(id){ return TOPICS[id] || customTopics[id]; }
function getSet(id, level){
  const extra = store.get(`set:${id}:${level}`, null);
  const base = TOPICS[id]?.[level];
  const v = [...(base?.v||[]), ...(extra?.v||[])];
  const p = [...(base?.p||[]), ...(extra?.p||[])];
  if(!v.length && !p.length) return null;
  return { v:v.map(([no,de])=>({no,de})), p:p.map(([no,de])=>({no,de})), tip: base ? TOPICS[id].tip : (extra?.tip||"") };
}
function progKey(id){ return `prog:${id}:${state.level}` }
function getProg(id){ return store.get(progKey(id), {written:null, oral:null, trained:0, right:0}) }
function saveProg(id,p){ store.set(progKey(id),p) }

/* ---------------- Helpers ---------------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const first = s=>s.split("|")[0];
const shuffle = a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const pick = a=>a[Math.floor(Math.random()*a.length)];
const norm = s=>s.toLowerCase().replace(/[.,!?;:«»"“”'()–—\-]/g," ").replace(/\s+/g," ").trim().replace(/^(en|ei|et|å) /,"");
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur } return prev[n] }
function grade(given, expected){
  const g = norm(given); if(!g) return "no";
  let best=1e9, len=1;
  for(const alt of expected.split("|")){ const e=norm(alt); const d=lev(g,e); if(d<best){best=d; len=e.length} }
  if(best===0) return "ok";
  if(best <= Math.max(1, Math.floor(len/10))) return "almost";
  return "no";
}
function similarity(heard, expected){
  let best=0; for(const alt of expected.split("|")){ const e=norm(alt), h=norm(heard); const s=1-lev(h,e)/Math.max(e.length,h.length,1); best=Math.max(best,s) } return best;
}

/* ---------------- Speech ---------------- */
let noVoice = null, voiceChecked=false;
function pickVoice(){
  const vs = (window.speechSynthesis?.getVoices?.()||[]);
  noVoice = vs.find(v=>/^(nb|no|nn)([-_]|$)/i.test(v.lang)) || vs.find(v=>/norw|norsk/i.test(v.name)) || null;
  voiceChecked = vs.length>0;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate=0.95){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(first(text)); u.lang = noVoice?.lang || "nb-NO"; if(noVoice) u.voice=noVoice; u.rate=rate; speechSynthesis.speak(u) }catch(e){}
}
function voiceNote(){
  if(!window.speechSynthesis) return `<p class="note">Dein Browser kann keine Sprache ausgeben – die Hörübungen zeigen dann den Text an.</p>`;
  if(voiceChecked && !noVoice) return `<p class="note">Auf diesem Gerät ist keine norwegische Stimme installiert, die Aussprache klingt deshalb evtl. falsch. Installiere „Norwegisch (Bokmål)“ in den Sprach-Einstellungen deines Systems.</p>`;
  return "";
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srOK = !!SR;
function listenOnce(){
  return new Promise((res,rej)=>{
    let r; try{ r=new SR() }catch(e){ return rej("unavailable") }
    r.lang="nb-NO"; r.interimResults=false; r.maxAlternatives=3;
    r.onresult=e=>res([...e.results[0]].map(a=>a.transcript));
    r.onerror=e=>rej(e.error||"error"); r.onend=()=>rej("no-speech");
    try{ r.start() }catch(e){ rej("unavailable") }
  });
}

function aiErr(e){
  const c=e?.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"){ sample=null; document.body.classList.remove("has-ai"); return "Die KI-Lehrerin ist in dieser Ansicht nicht freigegeben." }
  if(c==="rate_limited") return "Gerade zu viele Anfragen – bitte gleich noch einmal versuchen.";
  if(c==="session_expired") return "Bitte melde dich erneut an.";
  if(c==="cancelled") return "";
  return "Die KI hat gerade nicht geantwortet. Versuch es noch einmal.";
}

async function generateSet(id, t, extend){
  const cur=getSet(id,state.level);
  const avoid = cur ? cur.v.map(x=>first(x.no)).concat(cur.p.map(x=>x.no)).join("; ") : "";
  const prompt = `Erstelle Lernmaterial für Deutschsprachige, die Norwegisch (Bokmål) lernen.
Thema: ${t.de}
Niveau: ${LEVEL_DESC[state.level]}
Antworte nur mit JSON in genau dieser Form:
{"no_title":"norwegischer Thementitel","vocab":[{"no":"en hund","de":"der Hund"}],"phrases":[{"no":"Jeg har en hund.","de":"Ich habe einen Hund."}],"tip":"ein kurzer Grammatik- oder Kulturtipp auf Deutsch, 1–2 Sätze"}
Regeln: genau 12 vocab (Substantive mit unbestimmtem Artikel en/ei/et und deutschem Artikel, Verben im Infinitiv mit "å"), genau 6 phrases (vollständige, natürliche Sätze, höchstens 9 Wörter, passend zum Niveau). Korrektes, modernes Bokmål.${avoid?`\nKeine Wiederholung von: ${avoid}`:""}`;
  const data = await sample.json(prompt, {cache:false});
  const v=(data.vocab||[]).filter(x=>x&&x.no&&x.de).map(x=>[String(x.no),String(x.de)]);
  const p=(data.phrases||[]).filter(x=>x&&x.no&&x.de).map(x=>[String(x.no),String(x.de)]);
  if(!v.length) throw {code:"invalid_json"};
  const key=`set:${id}:${state.level}`; const old=store.get(key,{v:[],p:[],tip:""});
  store.set(key,{v:[...old.v,...v],p:[...old.p,...p],tip:old.tip||data.tip||""});
  if(customTopics[id] && data.no_title && !extend){ const d=dupOf(data.no_title); if(d){ delete customTopics[id]; store.set("custom",customTopics); state.topic=d; return } customTopics[id].no=String(data.no_title); store.set("custom",customTopics) }
}
function renderGenerate(pane,id,t){
  pane.innerHTML=`<div class="card"><h3 style="font-size:24px">Noch keine Inhalte auf ${state.level}</h3>
   <p class="muted ai-only">Ingrid erstellt 12 Wörter und 6 Sätze zum Thema „${esc(t.de)}“ auf deinem Niveau. Danach stehen alle Trainings und Tests bereit.</p>

const MP=(lon,lat)=>[((lon-4.3)*12).toFixed(1),((71.4-lat)*29).toFixed(1)];
function mapSvg(DATA,opts){
  const paths=Object.entries(DATA).map(([k,r])=>`<path vector-effect="non-scaling-stroke" data-r="${k}" tabindex="0" role="button" aria-label="${r.no}" d="M${r.poly.map(p=>MP(...p).join(" ")).join("L")}Z"/>`).join("");
  const cities=opts.cities?`<g class="cities">${CITIES.map(([n,lo,la])=>{ const [x,y]=MP(lo,la); return `<circle cx="${x}" cy="${y}" r="2.6"/><text class="city" x="${+x+4}" y="${+y+3}">${n}</text>` }).join("")}</g>`:"";
  const labels=opts.labels?`<g class="labels">${Object.entries(DATA).map(([k,r])=>{ const [x,y]=MP(...r.lab); return `<text class="rl" x="${x}" y="${y}" text-anchor="middle">${r.no}</text>` }).join("")}</g>`:"";
  return `<svg class="map" viewBox="-34 -6 364 400" role="group" aria-label="${opts.aria}">${paths}${cities}${labels}</svg>`;
}
function mapSection(host,DATA,opts){
  const n=Object.keys(DATA).length;
  host.innerHTML=`<div class="mapbox">
    <div class="mapwrap">${mapSvg(DATA,opts)}<div class="row" style="justify-content:space-between;margin-top:6px"><span class="note" style="margin:0">${opts.note}</span>${opts.zoom?`<button class="btn sm zoom" aria-pressed="false">Oslofjord vergrößern</button>`:""}</div></div>
    <div class="mapinfo"><div class="modes"><button class="btn sm primary" data-mm="explore">Erkunden</button><button class="btn sm" data-mm="quiz">Kartenquiz</button></div><div class="minfo"></div>
      ${opts.chips?`<div class="chips mchips">${Object.entries(DATA).sort((a,b)=>a[1].no.localeCompare(b[1].no,"nb")).map(([k,r])=>`<button class="chip mchip" data-c="${k}">${r.no}</button>`).join("")}</div>`:""}</div></div>`;
  const svg=host.querySelector("svg"), info=host.querySelector(".minfo"), chipBox=host.querySelector(".mchips");
  let mode="explore", target=null, score=0, tries=0, lock=false, asked=[];
  const clear=()=>{ svg.querySelectorAll("path").forEach(p=>p.classList.remove("sel","right","wrong")); host.querySelectorAll(".mchip").forEach(c=>c.classList.remove("on")) };
  const labelsOn=on=>{ const l=svg.querySelector(".labels"); if(l) l.style.display=on?"":"none" };
  function showRegion(k){
    const r=DATA[k]; clear(); svg.querySelector(`[data-r="${k}"]`).classList.add("sel"); host.querySelector(`[data-c="${k}"]`)?.classList.add("on");
    info.innerHTML=`<span class="label">${r.prep} ${r.no}</span><h3 style="font-size:30px;margin:2px 0">${r.no}</h3>${r.de!==r.no?`<div class="muted">${r.de}</div>`:""}
      <p style="margin:10px 0">${r.txt}</p><p class="muted" style="margin:0 0 10px">${r.meta}</p>
      <div class="vrow"><button class="icon rsay" aria-label="Anhören">${ICON.play}</button><div class="t"><div class="n" style="font-weight:400;font-family:var(--display);font-size:19px">${r.say}</div></div></div>`;
    info.querySelector(".rsay").onclick=()=>speak(r.say); speak(r.no);
  }
  function explore(){ mode="explore"; labelsOn(true); if(chipBox) chipBox.hidden=false; clear(); info.innerHTML=`<h3 style="font-size:24px">${opts.hint}</h3><p class="muted">Du hörst den Namen und erfährst, was ${opts.what} ausmacht.</p>` }
  function ask(){
    if(asked.length>=n) asked=[];
    target=pick(Object.keys(DATA).filter(k=>!asked.includes(k))); asked.push(target); clear(); lock=false;
    info.innerHTML=`<span class="label">Kartenquiz · ${score} / ${tries}</span><h3 style="font-size:28px;margin:4px 0">Hvor ligger ${DATA[target].no}?</h3><p class="muted">Tippe auf die Karte.</p><div class="qfb"></div>`;
  }
  function quiz(){ mode="quiz"; labelsOn(false); if(chipBox) chipBox.hidden=true; score=0; tries=0; asked=[]; ask() }
  function click(k){
    if(mode==="explore") return showRegion(k);
    if(lock) return; lock=true; tries++;
    const ok=k===target; if(ok) score++;
    svg.querySelector(`[data-r="${target}"]`).classList.add("right"); if(!ok) svg.querySelector(`[data-r="${k}"]`).classList.add("wrong");
    speak(DATA[target].no);
    info.querySelector(".qfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><div class="h">${ok?"Riktig!":"Feil – das war "+DATA[k].no+"."}</div><div>${DATA[target].say}</div><div class="row"><button class="btn primary sm qn">Nächste Frage</button></div></div>`;
    const qn=info.querySelector(".qn"); qn.onclick=ask; qn.focus();
  }
  svg.querySelectorAll("path").forEach(p=>{ p.onclick=()=>click(p.dataset.r); p.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); click(p.dataset.r) } } });
  host.querySelectorAll(".mchip").forEach(c=>c.onclick=()=>showRegion(c.dataset.c));
  const zb=host.querySelector(".zoom"); if(zb) zb.onclick=()=>{ const on=zb.getAttribute("aria-pressed")!=="true"; zb.setAttribute("aria-pressed",on); zb.textContent=on?"Ganze Karte":"Oslofjord vergrößern"; zb.classList.toggle("primary",on); svg.setAttribute("viewBox",on?opts.zoom:"-34 -6 364 400") };
  host.querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>{ host.querySelectorAll("[data-mm]").forEach(x=>x.classList.toggle("primary",x===b)); b.dataset.mm==="quiz"?quiz():explore() });
  explore();
}

function numNo(n){ const u=["null","en","to","tre","fire","fem","seks","sju","åtte","ni","ti","elleve","tolv","tretten","fjorten","femten","seksten","sytten","atten","nitten"], t={20:"tjue",30:"tretti",40:"førti",50:"femti",60:"seksti",70:"sytti",80:"åtti",90:"nitti"};
  if(n<20) return u[n]; if(n===100) return "hundre"; const T=Math.floor(n/10)*10, r=n%10; return t[T]+(r?u[r]:"") }
function numAlts(n){ const w=numNo(n), a=[w]; if(w.includes("sju")) a.push(w.replace("sju","syv")); if(n===1) a.push("ett"); if(n===100) a.push("ett hundre","en hundre"); return a.join("|") }
const OPS={"+":"pluss","−":"minus","×":"ganger","÷":"delt på"};
function calcTask(mode){
  const r=n=>Math.floor(Math.random()*n);
  if(mode==="add"){ if(Math.random()<.5){ const a=r(15)+1,b=r(20-a)+1; return [a,"+",b,a+b] } const a=r(19)+2,b=r(a)+1; return [a,"−",b,a-b] }
  if(mode==="big"){ if(Math.random()<.5){ const a=r(60)+10,b=r(100-a-1)+1; return [a,"+",b,a+b] } const a=r(80)+20,b=r(a-5)+1; return [a,"−",b,a-b] }
  if(Math.random()<.5){ const a=r(9)+2,b=r(9)+2; return [a,"×",b,a*b] } const b=r(9)+2,q=r(9)+2; return [b*q,"÷",b,q];
}
function calcSection(host){
  let mode=state.level==="A1"?"add":"mul", task=null, done=false, right=0, total=0;
  host.innerHTML=`<div class="mapbox calcbox">
    <div class="mapinfo"><div class="modes"><button class="btn sm" data-cm="add">+ − bis 20</button><button class="btn sm" data-cm="big">+ − bis 100</button><button class="btn sm" data-cm="mul">× ÷ Einmaleins</button></div>
      <div class="calc-q"><span id="cq"></span><button class="icon" id="cplay" aria-label="Anhören">${ICON.play}</button></div>
      <div class="muted" id="cqno"></div>
      <input class="ans" id="cin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ergebnis als Wort, z. B. tolv" style="margin-top:12px">
      <div class="keys"><button data-k="æ">æ</button><button data-k="ø">ø</button><button data-k="å">å</button><span>Norwegische Buchstaben</span></div>
      <div class="row"><button class="btn primary" id="cchk">Prüfen</button><button class="btn" id="cnext">Neue Aufgabe</button><span class="muted" id="cscore"></span></div>
      <div id="cfb"></div></div></div>`;
  const inp=$("#cin",host);
  host.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const s=inp.selectionStart??inp.value.length; inp.value=inp.value.slice(0,s)+k.dataset.k+inp.value.slice(inp.selectionEnd??s); inp.focus(); inp.setSelectionRange(s+1,s+1) });
  const say=()=>speak(`${numNo(task[0])} ${OPS[task[1]]} ${numNo(task[2])}`);
  function nextTask(){ task=calcTask(mode); done=false; inp.value=""; inp.disabled=false; $("#cfb").innerHTML="";
    $("#cq").textContent=`${task[0]} ${task[1]} ${task[2]} = ?`; $("#cqno").textContent=`${numNo(task[0])} ${OPS[task[1]]} ${numNo(task[2])} er …`;
    host.querySelectorAll("[data-cm]").forEach(b=>b.classList.toggle("primary",b.dataset.cm===mode)); }
  function check(){ if(done) return; if(!inp.value.trim()) return inp.focus(); done=true; inp.disabled=true;
    const ans=numAlts(task[3]); let r=grade(inp.value,ans); if(/^\d+$/.test(inp.value.trim())) r=+inp.value.trim()===task[3]?"almost":"no";
    total++; if(r!=="no") right++; $("#cscore").textContent=`${right} / ${total} richtig`;
    const sent=`${numNo(task[0])} ${OPS[task[1]]} ${numNo(task[2])} er ${numNo(task[3])}`;
    $("#cfb").innerHTML=`<div class="fb ${r}"><div class="h">${r==="ok"?"Riktig!":r==="almost"?(/^\d+$/.test(inp.value.trim())?"Richtig gerechnet – jetzt noch als Wort:":"Nesten! Fast richtig."):"Feil. Leider falsch."}</div>
      <div class="sol">${esc(sent[0].toUpperCase()+sent.slice(1))}.<button class="icon" id="csay" aria-label="Anhören">${ICON.play}</button></div><div class="muted">${task[0]} ${task[1]} ${task[2]} = ${task[3]}</div></div>`;
    $("#csay").onclick=()=>speak(sent); speak(sent); $("#cnext").focus(); }
  $("#cplay").onclick=say; $("#cchk").onclick=check; $("#cnext").onclick=()=>{ nextTask(); inp.focus() };
  inp.onkeydown=e=>{ if(e.key==="Enter") done?($("#cnext").click()):check() };
  host.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{ mode=b.dataset.cm; nextTask() });
  nextTask();
}

 tider:{no:"Fortid og framtid",de:"Vergangenheit & Zukunft",level:"A2",
  intro:`<p><b>Präteritum</b> (gestern, letztes Jahr): regelmäßige Verben bekommen <i>-et, -te, -de</i> oder <i>-dde</i>. Unregelmäßige ändern den Vokal: <i>gå → gikk</i>, <i>være → var</i>.</p><p><b>Perfekt</b> = <i>har</i> + Partizip: <i>har spist</i>, <i>har vært</i>. Immer mit <i>har</i> – auch dort, wo das Deutsche „sein“ benutzt: <i>Jeg har vært i Bergen</i> (ich <b>bin</b> gewesen).</p><p><b>Zukunft</b>: <i>skal</i> + Infinitiv für Pläne, <i>kommer til å</i> + Infinitiv für Vorhersagen.</p>`,

function parseDrill(d){
  if(d[0]==="g"){ const a=d[1].includes("___")?d[2]:d[2]; const full=d[1].includes("___")?d[1].replace(/\s*\([^)]*\)\s*$/,"").replace("___",first(a)).replace(/^./,c=>c.toUpperCase()):first(a); return {t:"gap",q:d[1],a,de:d[3]||"",full} }
  if(d[0]==="m") return {t:"mc",q:d[1],a:d[2][0],opts:shuffle(d[2]),full:d[3]||d[2][0],de:d[4]||""};
  if(d[0]==="o") return {t:"order",q:d[2],a:d[1],words:shuffle(d[1].replace(/[.,!?«»]/g,"").toLowerCase().split(/\s+/).filter(Boolean)),full:d[1],de:d[2]};
}
function gramGen(g){ return g.special==="verbs" ? ()=>verbGen(state.vfilter&&state.vfilter!=="all"?VERBS.filter(v=>String(v[5])===state.vfilter):VERBS) : ()=>parseDrill(pick(g.drills)) }

function renderGram(){
  const id=state.gram, g=GRAMMAR[id];
  const tabs=[["learn","Erklärung"],["train","Üben"],["test","Test"]];
  $("#app").innerHTML=`
   <div class="crumbs"><button class="back" id="back">← Übersicht</button><span class="label">Grammatik · ${g.level}</span></div>
   <div class="thead"><div><h2>${g.no}</h2><div class="sub">${g.de}</div></div></div>
   <div class="tabs-wrap"><div class="tabs" role="tablist">${tabs.map(([k,a])=>`<button role="tab" data-gt="${k}" aria-selected="${state.gtab===k}">${a}</button>`).join("")}</div></div>
   <div id="pane"></div>`;
  $("#back").onclick=()=>{ state.view="home"; render() };
  document.querySelectorAll("[data-gt]").forEach(b=>b.onclick=()=>{ state.gtab=b.dataset.gt; renderGram() });
  const pane=$("#pane");
  if(state.gtab==="learn") return g.special==="verbs"?renderVerbs(pane):renderGramLearn(pane,g);
  if(state.gtab==="train") return runGram(pane,g,"train");
  const best=store.get("gram:"+id,null);
  pane.innerHTML=`<div class="stage"><div class="card"><span class="label">Test · ${g.de}</span><h3 style="font-size:28px;margin:6px 0 10px">10 Aufgaben, ohne Hilfe</h3>
    <p class="muted" style="max-width:60ch">Du siehst die Lösungen erst am Ende. Fast richtige Antworten (kleiner Tippfehler) zählen halb.</p>
    <div class="row" style="margin-top:14px"><button class="btn red" id="s1">Test beginnen</button>${best!=null?`<span class="muted">Bisher bestes Ergebnis: ${best} % · Note ${gradeOf(best)}</span>`:""}</div></div>
    <div class="side"><div class="panel"><h4>Norwegische Noten</h4>${scaleTable()}</div></div></div>`;
  $("#s1").onclick=()=>runGram(pane,g,"test");
}
function gtable(t){ return `<div class="tablewrap"><table class="gt"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` }
function askBox(topic){
  return `<div class="panel ai-only" style="margin-top:18px"><h4>Frag Ingrid zu diesem Thema</h4><div class="chat-in"><textarea class="ans" id="gq" rows="1" placeholder="z. B. Wann sage ich ei und wann en?"></textarea><button class="btn primary" id="gqb">Fragen</button></div><div id="gqa"></div></div>`;
}
function wireAsk(topic){
  const b=$("#gqb"); if(!b) return;
  const go=async()=>{ const q=$("#gq").value.trim(); if(!q||!sample) return; b.disabled=true; b.classList.add("spin"); const out=$("#gqa");
    try{ await sample(`Du bist Ingrid, Norwegischlehrerin für Deutschsprachige (Niveau ${state.level}). Grammatikthema: ${topic}. Frage des Lernenden: "${q.slice(0,800)}"\nAntworte auf Deutsch, kurz und klar (max. 120 Wörter), mit 1–3 norwegischen Beispielsätzen samt Übersetzung. Vergleiche mit dem Deutschen, wo es hilft. Kein Markdown.`,{modelTier:"quick",cache:false,onText:({text})=>{ out.innerHTML='<div class="ai-out" style="margin-top:10px"></div>'; out.firstChild.textContent=text }}) }
    catch(e){ out.innerHTML=`<p class="note">${esc(aiErr(e))}</p>` } b.disabled=false; b.classList.remove("spin") };
  b.onclick=go; $("#gq").onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); go() } };
}
function renderGramLearn(pane,g){
  pane.innerHTML=`<div class="gintro">${g.intro}</div>${g.tables.map(gtable).join("")}
   <div class="sec-h"><h3>Beispiele</h3><span class="muted">Antippen zum Anhören</span></div>

  pane.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));

}
function renderVerbs(pane){
  const f=state.vfilter||"all";
  pane.innerHTML=`<div class="gintro"><p>Norwegische Verben haben <b>keine Personalendungen</b> – du lernst nur die Zeitformen. Regelmäßige Verben folgen vier Mustern. Die unregelmäßigen lernst du auswendig, wie im Deutschen „gehen – ging – gegangen“.</p><p>Tipp: Übe zuerst eine Gruppe. Der Filter gilt auch für „Üben“.</p></div>
   <div class="modes">${[["all","Alle"],...Object.entries(VGROUP)].map(([k,l])=>`<button class="btn sm ${f===k?"primary":""}" data-vf="${k}">${l}</button>`).join("")}</div>
   <input class="ans" id="vsearch" placeholder="Verb suchen (norwegisch oder deutsch)" style="font-size:16px;margin-bottom:10px">
   <div class="tablewrap"><table class="gt vt"><thead><tr><th></th><th>Infinitiv</th><th>Presens</th><th>Preteritum</th><th>Perfektum</th><th>Deutsch</th></tr></thead><tbody id="vbody"></tbody></table></div>
   <div class="row" style="margin-top:16px"><button class="btn primary" id="go-train">Konjugation üben</button></div>${askBox("Verben und Zeitformen")}`;
  const draw=()=>{ const q=$("#vsearch").value.trim().toLowerCase();
    const list=VERBS.filter(v=>(f==="all"||String(v[5])===f)&&(!q||v.join(" ").toLowerCase().includes(q)));
    $("#vbody").innerHTML=list.map(v=>`<tr><td><button class="icon" style="width:32px;height:32px" data-v="${esc(v[0])}" aria-label="Anhören">${ICON.play}</button></td><td><b>${v[0]}</b></td><td>${first(v[1])}</td><td>${v[2].replace("|"," / ")}</td><td>${v[3].replace("|"," / ")}</td><td class="muted">${v[4]}</td></tr>`).join("")||`<tr><td colspan="6" class="muted">Kein Verb gefunden.</td></tr>`;
    $("#vbody").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ const v=VERBS.find(x=>x[0]===b.dataset.v); speak(`${v[0]}, ${first(v[1])}, ${first(v[2])}, ${first(v[3])}`,.85) }) };
  $("#vsearch").oninput=draw; draw();
  pane.querySelectorAll("[data-vf]").forEach(b=>b.onclick=()=>{ state.vfilter=b.dataset.vf; renderVerbs(pane) });
  $("#go-train").onclick=()=>{ state.gtab="train"; renderGram() };
  wireAsk("Verben und Zeitformen");
}
function runGram(pane,g,mode){
  const gen=gramGen(g), id=state.gram;
  let queue=null;
  if(mode==="test"){ const seen=new Set(); queue=[]; let guard=0; while(queue.length<10&&guard++<200){ const ex=g.special==="verbs"?verbGen(VERBS):parseDrill(pick(g.drills)); if(!seen.has(ex.q)){ seen.add(ex.q); queue.push(ex) } } }
  const S={i:0,res:[],right:0,total:0,streak:0};
  pane.innerHTML=`<div class="stage"><div class="card" id="ex"></div><div class="side" id="side"></div></div>`;
  const keys=`<div class="keys"><button data-k="æ">æ</button><button data-k="ø">ø</button><button data-k="å">å</button><span>Norwegische Buchstaben</span></div>`;
  next();
  function next(){ if(mode==="test"&&S.i>=queue.length) return finish(); side(); draw(mode==="test"?queue[S.i]:gen()) }
  function side(){
    const el=$("#side");
    if(mode==="test") el.innerHTML=`<div class="panel"><h4>Fortschritt</h4><div class="stat">${S.i+1} / ${queue.length}</div><div class="dots">${queue.map((_,k)=>`<i class="${k<S.i?"done":k===S.i?"cur":""}"></i>`).join("")}</div></div><div class="panel"><button class="btn sm" id="quit">Test abbrechen</button></div>`;
    else { const pct=S.total?Math.round(S.right/S.total*100):0; el.innerHTML=`<div class="panel"><h4>Diese Runde</h4><div class="stat">${S.right} / ${S.total}</div><div class="bar"><i style="width:${pct}%"></i></div><p class="note">Serie: ${S.streak} richtig hintereinander</p></div>${g.special==="verbs"&&state.vfilter&&state.vfilter!=="all"?`<div class="panel"><h4>Filter</h4><p class="note" style="margin:0">${VGROUP[state.vfilter]}</p></div>`:""}<div class="panel"><button class="btn sm" id="quit">Beenden</button></div>` }
    $("#quit").onclick=()=>{ state.gtab=mode==="test"?"test":"learn"; renderGram() };
  }
  function draw(ex){
    const el=$("#ex"); let done=false;
    const m=ex.q.match(/^(.*?)\s*(\([^)]*\))?\s*$/); const main=m[1], hint=m[2]||"";
    const label=ex.verb?"Konjugiere":ex.t==="mc"?"Wähle die richtige Form":ex.t==="order"?"Bilde den Satz":"Ergänze";
    const promptHtml=`<div class="prompt ${ex.verb?"":"small"}">${esc(main).replace("___",'<span class="gap"></span>')}${hint?` <span class="muted" style="font-family:var(--body);font-size:17px">${esc(hint)}</span>`:""}</div>${ex.verb?`<p class="muted" style="margin-top:-10px">${esc(ex.de)}</p>`:""}`;
    const head=`<div class="kind"><span class="label">${label}</span><span class="label">${g.de}</span></div>`;
    if(ex.t==="gap"){
      el.innerHTML=head+promptHtml+`<input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort …">${keys}<div class="row"><button class="btn primary" id="chk">Prüfen</button></div><div id="fbx"></div>`;
      const inp=$("#in"); inp.focus();
      el.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const s=inp.selectionStart??inp.value.length; inp.value=inp.value.slice(0,s)+k.dataset.k+inp.value.slice(inp.selectionEnd??s); inp.focus(); inp.setSelectionRange(s+1,s+1) });
      const go=()=>{ if(done) return; if(!inp.value.trim()) return inp.focus(); done=true; inp.disabled=true; $("#chk").disabled=true; settle(ex,inp.value,gradeG(inp.value,ex.a)) };
      $("#chk").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go() };
    }
    if(ex.t==="mc"){
      el.innerHTML=head+`<div class="prompt small">${esc(ex.q).replace("___",'<span class="gap"></span>')}</div><div class="opts">${ex.opts.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o)}</button>`).join("")}</div><div id="fbx"></div>`;
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(done) return; done=true; const given=ex.opts[+b.dataset.o], r=given===ex.a?"ok":"no";
        if(mode==="train"){ el.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(ex.opts[+x.dataset.o]===ex.a) x.classList.add("ok") }); if(r==="no") b.classList.add("no") } else b.classList.add("sel");
        settle(ex,given,r) });
    }
    if(ex.t==="order"){
      el.innerHTML=head+`<div class="prompt small">${esc(ex.q)}</div><div class="built" id="built"></div><div class="pool">${ex.words.map((w,k)=>`<button class="word" data-w="${k}">${esc(w)}</button>`).join("")}</div><div class="row"><button class="btn primary" id="chk">Prüfen</button><button class="btn" id="rst">Zurücksetzen</button></div><div id="fbx"></div>`;
      const chosen=[], built=$("#built");
      const dr=()=>{ built.innerHTML=chosen.map((k,ix)=>`<button class="word" data-b="${ix}">${esc(ex.words[k])}</button>`).join(""); el.querySelectorAll(".pool .word").forEach(b=>b.classList.toggle("used",chosen.includes(+b.dataset.w))); built.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ if(done) return; chosen.splice(+b.dataset.b,1); dr() }) };
      el.querySelectorAll(".pool .word").forEach(b=>b.onclick=()=>{ if(done||chosen.includes(+b.dataset.w)) return; chosen.push(+b.dataset.w); dr() });
      $("#rst").onclick=()=>{ if(done) return; chosen.length=0; dr() };
      $("#chk").onclick=()=>{ if(done||!chosen.length) return; done=true; const given=chosen.map(k=>ex.words[k]).join(" "); settle(ex,given,norm(given)===norm(ex.a)?"ok":"no") };
    }
  }
  function gradeG(given,expected){ const g2=given.trim().toLowerCase().replace(/\s+/g," ").replace(/[.!?]$/,""); for(const alt of expected.split("|")) if(g2===alt.toLowerCase()) return "ok"; if(expected.split("|").every(x=>x.length<=6)) return "no"; return grade(given,expected) }
  function settle(ex,given,r){
    S.res.push({ex,given,r});
    if(mode==="test"){ S.i++; setTimeout(next,ex.t==="mc"?350:150); return }
    S.total++; if(r!=="no"){ S.right++; S.streak++ } else S.streak=0; side();
    const head=r==="ok"?"Riktig! Richtig.":r==="almost"?"Nesten! Fast richtig.":"Feil. Leider falsch.";
    $("#fbx").innerHTML=`<div class="fb ${r}"><div class="h">${head}</div>
      ${ex.t==="gap"&&!ex.verb?`<div class="muted">Lösung: <b>${esc(first(ex.a))}</b></div>`:""}
      <div class="sol">${esc(ex.full)}<button class="icon" id="fs" aria-label="Anhören">${ICON.play}</button></div>
      ${ex.de&&!ex.verb?`<div class="muted">${esc(ex.de)}</div>`:""}
      ${r!=="ok"?`<div class="muted">Deine Antwort: „${esc(given)}“</div>`:""}
      <div id="aiex"></div>
      <div class="row" style="margin-top:6px"><button class="btn primary" id="nx">Weiter</button>${r!=="ok"?`<button class="btn ai-only" id="why">Warum? Ingrid fragen</button>`:""}</div></div>`;
    $("#fs").onclick=()=>speak(ex.full); const nx=$("#nx"); nx.focus(); autoNext(nx,next,r,ex.full);
    const why=$("#why"); if(why) why.onclick=()=>explain({label:`Grammatik „${g.de}“: ${ex.q}`,item:{no:ex.full,de:ex.de||first(ex.a)}},given,why);
  }
  function finish(){
    let pts=0; for(const x of S.res) pts+=x.r==="ok"?1:x.r==="almost"?.5:0;
    const pct=Math.round(pts/S.res.length*100), gr=gradeOf(pct); const best=store.get("gram:"+id,null); if(best==null||pct>best) store.set("gram:"+id,pct);
    const mark={ok:"✓",almost:"½",no:"✗"};
    $("#side").innerHTML=`<div class="panel"><h4>Notenskala</h4>${scaleTable()}</div>`;
    $("#ex").innerHTML=`<div class="result-head"><div class="grade">${gr}</div><div><span class="label">Ergebnis · ${g.de}</span><h3 style="font-size:28px">${GRADE_TXT[gr][0].toUpperCase()+GRADE_TXT[gr].slice(1)}</h3><div class="muted">${pts} von ${S.res.length} Punkten · ${pct} %</div></div></div>
      <div class="review">${S.res.map(x=>`<div><span class="m ${x.r}">${mark[x.r]}</span><span><b>${esc(x.ex.full)}</b>${x.ex.verb?` – ${esc(x.ex.q.split("→")[1].trim())}: <b>${esc(first(x.ex.a))}</b>`:""}${x.r!=="ok"?`<br><span class="muted">Deine Antwort: ${esc(x.given)}</span>`:""}</span></div>`).join("")}</div>
      <div class="row" style="margin-top:16px"><button class="btn red" id="again">Neuer Test</button><button class="btn" id="tr">Zum Üben</button></div>`;
    $("#again").onclick=()=>runGram(pane,g,"test"); $("#tr").onclick=()=>{ state.gtab="train"; renderGram() };
  }
}

function baseSet(ref,lv){ const b=TOPICS[ref][lv]; return {v:b.v.map(([no,de])=>({no,de,kind:"v"})),p:b.p.map(([no,de])=>({no,de,kind:"p"}))} }
let PATH_CACHE=null;
function buildPath(){
  if(PATH_CACHE) return PATH_CACHE;
  const units=[]; let n=0;
  for(const lv of ["A1","A2"]) for(const ref of PATH_ORDER[lv]){ n++;
    let lessons, meta;
    if(ref.startsWith("g:")){ const gid=ref.slice(2), g=GRAMMAR[gid];
      lessons = g.special==="verbs" ? [{t:"verbs",f:"reg",title:"Regelmäßige Verben"},{t:"verbs",f:"s",title:"Unregelmäßige Verben"},{t:"verbs",f:"all",title:"Kontrolle",check:true}]
                                    : [{t:"gram",title:"Regel & Üben"},{t:"gram",title:"Kontrolle",check:true}];
      meta={kind:"gram",ref:gid,no:g.no,de:"Grammatik: "+g.de};
    } else { const t=TOPICS[ref], half=Math.ceil(t[lv].v.length/2);
      lessons=[{t:"words",from:0,to:half,title:"Wörter 1"},{t:"words",from:half,to:t[lv].v.length,title:"Wörter 2"},{t:"phrases",title:"Sätze"},{t:"check",title:"Kontrolle",check:true}];
      meta={kind:"topic",ref,no:t.no,de:t.de};
    }
    units.push({n,lv,...meta,lessons:lessons.map((l,i)=>({...l,id:`${lv}:${ref}:${i}`,unit:n}))});
  }
  return PATH_CACHE=units;
}

function startLesson(id){ state.view="lesson"; state.lesson=id; render() }

function buildLesson(L,u){
  const steps=[]; let S=null;
  if(u.kind==="topic"){ S=baseSet(u.ref,u.lv);
    if(L.t==="words"){ const W=S.v.slice(L.from,L.to);
      for(const w of W) steps.push({k:"intro",item:w},{k:"mc",dir:"no-de",item:w});
      if(W.length>=3) steps.push({k:"match",items:shuffle(W).slice(0,5)});
      for(const w of shuffle(W)) steps.push({k:"type",item:w});
      shuffle(W).slice(0,3).forEach(w=>steps.push({k:"listen",item:w}));
      shuffle(W).slice(0,2).forEach(w=>steps.push({k:"mc",dir:"de-no",item:w}));
      steps.push({k:"speak",item:pick(W)},{k:"dictate",item:pick(W)});
    }
    if(L.t==="phrases"){ const P=S.p, short=[...P].sort((a,b)=>a.no.length-b.no.length);
      for(const p of P) steps.push({k:"intro",item:p},{k:"order",item:p});
      shuffle(P).slice(0,2).forEach(p=>steps.push({k:"mc",dir:"no-de",item:p}));
      shuffle(P).slice(0,3).forEach(p=>steps.push({k:"listen",item:p}));
      short.slice(0,2).forEach(p=>steps.push({k:"type",item:p}));
      shuffle(P).slice(0,2).forEach(p=>steps.push({k:"speak",item:p}));
      steps.push({k:"dictate",item:short[0]});
    }
    if(L.t==="check"){ const V=shuffle(S.v), Pp=shuffle(S.p), mix=[];
      V.slice(0,4).forEach(w=>mix.push({k:"type",item:w})); V.slice(4,7).forEach(w=>mix.push({k:"mc",dir:"de-no",item:w})); V.slice(7,9).forEach(w=>mix.push({k:"listen",item:w}));
      Pp.slice(0,2).forEach(p=>mix.push({k:"order",item:p})); mix.push({k:"mc",dir:"no-de",item:Pp[2]||V[3]});
      mix.push({k:"dictate",item:Pp[3]||V[0]}); mix.push({k:"speak",item:Pp[4]||V[1]},{k:"speak",item:V[2]});
      steps.push({k:"match",items:(V.length>=14?V.slice(9,14):V.slice(0,5))},...shuffle(mix));
    }
  } else if(L.t==="gram"){ const g=GRAMMAR[u.ref], n=L.check?10:12, D=[];
    while(D.length<n) D.push(...shuffle(g.drills));
    if(!L.check) steps.push({k:"gintro",g});
    D.slice(0,n).forEach(d=>steps.push({k:"drill",ex:parseDrill(d)}));
  } else if(L.t==="verbs"){ const list=L.f==="reg"?VERBS.filter(v=>typeof v[5]==="number"):L.f==="s"?VERBS.filter(v=>v[5]==="s"):VERBS;
    if(!L.check) steps.push({k:"vintro",list});
    const seen=new Set(), n=L.check?12:14; let guard=0;
    while(steps.filter(s=>s.k==="drill").length<n&&guard++<400){ const ex=verbGen(list); if(!seen.has(ex.q)){ seen.add(ex.q); steps.push({k:"drill",ex}) } }
  }
  return {steps,S};
}

function openTutorial(){
  let i=0; const m=document.createElement("div"); m.className="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Tutorial");
  document.body.appendChild(m);
  const close=()=>{ m.remove(); store.set("tutSeen",true); document.removeEventListener("keydown",key) };
  const key=e=>{ if(e.key==="Escape") close(); if(e.key==="ArrowRight"&&i<TUT.length-1){ i++; draw() } if(e.key==="ArrowLeft"&&i>0){ i--; draw() } };
  document.addEventListener("keydown",key);
  function draw(){ const [t,x]=TUT[i];
    m.innerHTML=`<div class="card tut"><div class="row" style="justify-content:space-between"><span class="label">Tutorial · ${i+1} / ${TUT.length}</span><button class="lx" id="tx" aria-label="Tutorial schließen">${ICON.x}</button></div>
      <h3>${t}</h3><p>${x}</p>
      <div class="tdots">${TUT.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="row" style="justify-content:space-between"><button class="btn" id="tb" ${i===0?"disabled":""}>Zurück</button>${i<TUT.length-1?`<button class="btn primary" id="tn">Weiter</button>`:`<button class="btn red" id="tn">Los geht's!</button>`}</div></div>`;
    $("#tx").onclick=close; $("#tb").onclick=()=>{ if(i>0){ i--; draw() } };
    const tn=$("#tn"); tn.focus(); tn.onclick=()=>{ if(i<TUT.length-1){ i++; draw() } else close() } }
  m.onclick=e=>{ if(e.target===m) close() };
  draw();
}

function autoNext(btn,fn,r,txt){ let fired=false, t=null; const go=()=>{ if(fired) return; fired=true; clearTimeout(t); fn() }; btn.onclick=go;
  if(r!=="ok") return; const ms=(txt&&String(txt).length>25)?2200:1500;
  btn.classList.add("auto"); btn.style.setProperty("--auto-ms",ms+"ms"); t=setTimeout(()=>{ if(btn.isConnected) go() },ms) }

function distract(pool, item, key, n=3){ return shuffle(pool.filter(x=>x!==item && first(x[key])!==first(item[key]))).slice(0,n) }
function makeEx(kind, set){
  const all=[...set.v,...set.p];
  if(kind==="mc"){ const dir=Math.random()<.5?"de-no":"no-de"; const pool=Math.random()<.6?set.v:set.p; const it=pick(pool);
    const from=dir==="de-no"?"de":"no", to=dir==="de-no"?"no":"de";
    return {kind,dir,item:it,prompt:first(it[from]),answer:first(it[to]),options:shuffle([it,...distract(pool,it,to)]).map(x=>first(x[to])),label:dir==="de-no"?"Wähle die Übersetzung · Deutsch → Norwegisch":"Was bedeutet das? · Norwegisch → Deutsch"} }
  if(kind==="type"){ const it=pick(Math.random()<.65?set.v:set.p); return {kind,item:it,prompt:it.de,answer:it.no,label:"Schreibe auf Norwegisch"} }
  if(kind==="order"){ const cands=set.p.filter(x=>x.no.split(" ").length>=3 && x.no.split(" ").length<=10); const it=pick(cands.length?cands:set.p);
    const words=it.no.replace(/[.,!?]/g,"").toLowerCase().split(/\s+/).filter(Boolean); return {kind,item:it,prompt:it.de,answer:it.no,words:shuffle(words),label:"Bilde den Satz"} }
  if(kind==="listen"){ const pool=Math.random()<.5?set.v:set.p; const it=pick(pool); return {kind,item:it,say:it.no,answer:it.de,options:shuffle([it,...distract(pool,it,"de")]).map(x=>x.de),label:"Hören · Was bedeutet das?"} }
  if(kind==="dictate"){ const it=pick(Math.random()<.5?set.v:set.p); return {kind,item:it,say:it.no,answer:it.no,label:"Diktat · Schreibe, was du hörst"} }
  if(kind==="speak"){ const it=pick(Math.random()<.4?set.v:set.p); return {kind,item:it,prompt:it.de,answer:it.no,label:"Sprechen · Sag es auf Norwegisch"} }
}
const KINDS={written:["mc","type","order"], oral:["listen","dictate","speak"]};
function buildTest(channel,set){
  const plan = channel==="written" ? ["mc","mc","mc","type","type","type","type","order","order","mc"] : ["listen","listen","listen","listen","dictate","dictate","dictate","speak","speak","speak"];
  const seen=new Set(); return plan.map(k=>{ let ex, tries=0; do{ ex=makeEx(k,set); tries++ }while(seen.has(k+ex.item.no) && tries<12); seen.add(k+ex.item.no); return ex });
}

const GRADE_TXT={6:"hervorragend",5:"sehr gut",4:"gut",3:"befriedigend",2:"schwach bestanden",1:"nicht bestanden"};
function scaleTable(){ return `<table class="scale">${[[6,"92–100"],[5,"77–91"],[4,"60–76"],[3,"45–59"],[2,"30–44"],[1,"0–29"]].map(([g,r])=>`<tr><td><b>${g}</b></td><td>${GRADE_TXT[g]}</td><td style="text-align:right">${r} %</td></tr>`).join("")}</table>` }

/* ---------------- Session runner ---------------- */
function runSession(pane,mode,channel){
  const id=state.topic, set=getSet(id,state.level);
  const S={mode,channel,set,i:0,results:[],queue: mode==="test"?buildTest(channel,set):null, right:0, total:0, streak:0};
  pane.innerHTML=`<div class="stage"><div class="card" id="ex"></div><div class="side" id="side"></div></div>`;
  next();
  function next(){
    if(mode==="test" && S.i>=S.queue.length) return finish();
    const ex = mode==="test" ? S.queue[S.i] : makeEx(pick(KINDS[channel]), set);
    drawSide(); drawEx(ex);
  }
  function drawSide(){
    const side=$("#side");
    if(mode==="test"){
      side.innerHTML=`<div class="panel"><h4>Fortschritt</h4><div class="stat">${S.i+1} / ${S.queue.length}</div><div class="dots">${S.queue.map((_,k)=>`<i class="${k<S.i?"done":k===S.i?"cur":""}"></i>`).join("")}</div></div>
       <div class="panel"><button class="btn sm" id="quit">Test abbrechen</button></div>`;
      $("#quit").onclick=()=>renderStart(pane,mode,channel);
    } else {
      const pct=S.total?Math.round(S.right/S.total*100):0;
      side.innerHTML=`<div class="panel"><h4>Diese Runde</h4><div class="stat">${S.right} / ${S.total}</div><div class="bar"><i style="width:${pct}%"></i></div><p class="note">Serie: ${S.streak} richtig hintereinander</p></div>
       <div class="panel"><button class="btn sm" id="quit">Training beenden</button></div>`;
      $("#quit").onclick=()=>renderStart(pane,mode,channel);
    }
  }
  function drawEx(ex){
    const el=$("#ex"); let done=false;
    const head=`<div class="kind"><span class="label">${esc(ex.label)}</span>${mode==="train"?`<span class="label">${channel==="written"?"schriftlich":"mündlich"}</span>`:""}</div>`;
    const keys=`<div class="keys" aria-label="Sonderzeichen"><button data-k="æ">æ</button><button data-k="ø">ø</button><button data-k="å">å</button><span>Norwegische Buchstaben</span></div>`;
    const playRow=`<div class="play-big"><button class="icon" id="p1" aria-label="Anhören">${ICON.play}</button><button class="icon" id="p2" aria-label="Langsam anhören" style="width:44px;height:44px;background:var(--fjord-soft);color:var(--fjord)">${ICON.slow}</button><span class="muted">Anhören · langsam</span></div>`;
    if(ex.kind==="mc"||ex.kind==="listen"){
      el.innerHTML=head+(ex.kind==="mc"?`<div class="prompt">${esc(ex.prompt)}</div>`:playRow+(window.speechSynthesis?"":`<div class="prompt small">${esc(first(ex.say))}</div>`))+`<div class="opts">${ex.options.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o)}</button>`).join("")}</div><div id="fbx"></div>`;
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(done) return; done=true; const given=ex.options[+b.dataset.o]; const r=given===ex.answer?"ok":"no";
        if(mode==="train"){ el.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(ex.options[+x.dataset.o]===ex.answer) x.classList.add("ok") }); if(r==="no") b.classList.add("no") } else b.classList.add("sel");
        settle(ex,given,r) });
    }
    if(ex.kind==="type"||ex.kind==="dictate"){
      el.innerHTML=head+(ex.kind==="type"?`<div class="prompt">${esc(ex.prompt)}</div>`:playRow+(window.speechSynthesis?"":`<p class="note">Keine Sprachausgabe: Text erscheint kurz. ${esc(first(ex.say))}</p>`))+
        `<input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ex.kind==="type"?"Auf Norwegisch …":"Was hörst du?"}">${keys}<div class="row"><button class="btn primary" id="chk">Prüfen</button>${mode==="train"?`<button class="btn" id="hint">Tipp</button>`:""}</div><div id="fbx"></div>`;
      const inp=$("#in"); inp.focus();
      el.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const s=inp.selectionStart??inp.value.length, e2=inp.selectionEnd??s; inp.value=inp.value.slice(0,s)+k.dataset.k+inp.value.slice(e2); inp.focus(); inp.setSelectionRange(s+1,s+1) });
      const go=()=>{ if(done) return; if(!inp.value.trim()) { inp.focus(); return } done=true; inp.disabled=true; $("#chk").disabled=true; settle(ex,inp.value,grade(inp.value,ex.answer)) };
      $("#chk").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go() };
      const h=$("#hint"); if(h) h.onclick=()=>{ const a=first(ex.answer); h.textContent=`Beginnt mit „${a.split(" ").map(w=>w.slice(0,2)).join(" … ")}“`; h.disabled=true };
    }
    if(ex.kind==="order"){
      el.innerHTML=head+`<div class="prompt small">${esc(ex.prompt)}</div><div class="built" id="built" aria-label="Dein Satz"></div><div class="pool">${ex.words.map((w,k)=>`<button class="word" data-w="${k}">${esc(w)}</button>`).join("")}</div><div class="row"><button class="btn primary" id="chk">Prüfen</button><button class="btn" id="rst">Zurücksetzen</button></div><div id="fbx"></div>`;
      const chosen=[]; const built=$("#built");
      const draw=()=>{ built.innerHTML=chosen.map((k,ix)=>`<button class="word" data-b="${ix}">${esc(ex.words[k])}</button>`).join(""); el.querySelectorAll(".pool .word").forEach(b=>b.classList.toggle("used",chosen.includes(+b.dataset.w)));
        built.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ if(done) return; chosen.splice(+b.dataset.b,1); draw() }) };
      el.querySelectorAll(".pool .word").forEach(b=>b.onclick=()=>{ if(done||chosen.includes(+b.dataset.w)) return; chosen.push(+b.dataset.w); draw() });
      $("#rst").onclick=()=>{ if(done) return; chosen.length=0; draw() };
      $("#chk").onclick=()=>{ if(done||!chosen.length) return; done=true; const given=chosen.map(k=>ex.words[k]).join(" "); settle(ex,given,norm(given)===norm(ex.answer)?"ok":"no") };
    }
    if(ex.kind==="speak"){
      el.innerHTML=head+`<div class="prompt">${esc(ex.prompt)}</div><p class="muted" style="margin-top:-8px">Sag den Satz laut auf Norwegisch.</p>
        <div class="row" id="sp-ctl">${srOK?`<button class="btn primary" id="rec">${ICON.mic.replace("<svg","<svg width=16 height=16 style='vertical-align:-3px;margin-right:6px'")}Sprechen</button>`:""}<button class="btn ${srOK?"":"primary"}" id="reveal">Gesagt – Lösung zeigen</button></div><div id="heard" class="note"></div><div id="fbx"></div>`;
      $("#reveal").onclick=()=>{ if(done) return; selfRate() };
      const rec=$("#rec"); if(rec) rec.onclick=async()=>{ if(done) return; rec.disabled=true; rec.classList.add("spin"); $("#heard").textContent="Ich höre zu …";
        try{ const alts=await listenOnce(); let best=0,bestT=alts[0]; for(const a of alts){ const s=similarity(a,ex.answer); if(s>best){best=s;bestT=a} }
          $("#heard").textContent=`Gehört: „${bestT}“`; done=true; $("#sp-ctl").hidden=true; settle(ex,bestT,best>=.85?"ok":best>=.6?"almost":"no");
        }catch(err){ rec.classList.remove("spin"); rec.disabled=false;
          if(["not-allowed","service-not-allowed","audio-capture","unavailable","network"].includes(err)){ srOK=false; rec.remove(); $("#heard").textContent="Das Mikrofon ist hier nicht verfügbar. Sprich laut und bewerte dich selbst."; $("#reveal").classList.add("primary") }
          else $("#heard").textContent="Nichts verstanden – noch einmal versuchen oder Lösung zeigen."; } };
      function selfRate(){
        $("#sp-ctl").hidden=true;
        const box=document.createElement("div"); box.className="fb almost";
        box.innerHTML=`<div class="h">Vergleiche mit deiner Aussprache</div><div class="sol">${esc(first(ex.answer))}<button class="icon" id="sv">${ICON.play}</button></div><div class="row"><span class="muted">Wie war's?</span><button class="btn sm" data-r="ok">Richtig</button><button class="btn sm" data-r="almost">Fast</button><button class="btn sm" data-r="no">Falsch</button></div>`;
        $("#fbx").appendChild(box); speak(ex.answer); $("#sv").onclick=()=>speak(ex.answer);
        box.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ done=true; box.remove(); settle(ex,"(selbst bewertet)",b.dataset.r,true) });
      }
    }
    const p1=$("#p1"), p2=$("#p2"); if(p1){ p1.onclick=()=>speak(ex.say); p2.onclick=()=>speak(ex.say,.65); speak(ex.say) }
  }
  function settle(ex,given,r,selfRated){
    S.results.push({ex,given,r});
    if(mode==="test"){ S.i++; setTimeout(next, ex.kind==="mc"||ex.kind==="listen"?350:150); return }
    S.total++; if(r!=="no"){ S.right++; S.streak++ } else S.streak=0;
    const p=getProg(state.topic); p.trained++; if(r!=="no") p.right++; saveProg(state.topic,p); drawSide();
    const fb=$("#fbx"); const sol=first(ex.kind==="mc"||ex.kind==="listen"?ex.answer:ex.item.no);
    const head = r==="ok"?"Riktig! Richtig.":r==="almost"?"Nesten! Fast richtig.":"Feil. Leider falsch.";
    fb.innerHTML=`<div class="fb ${r}"><div class="h">${head}</div>
      <div class="sol">${esc(first(ex.item.no))}<button class="icon" id="fs" aria-label="Anhören">${ICON.play}</button></div>
      <div class="muted">${esc(ex.item.de)}</div>
      ${r!=="ok"&&!selfRated&&ex.kind!=="speak"?`<div class="muted">Deine Antwort: „${esc(given)}“</div>`:""}
      <div id="aiex"></div>
      <div class="row" style="margin-top:6px"><button class="btn primary" id="nx">Weiter</button>${r!=="ok"?`<button class="btn ai-only" id="why">Warum? Ingrid fragen</button>`:""}</div></div>`;
    $("#fs").onclick=()=>speak(ex.item.no);
    const nx=$("#nx"); nx.focus(); autoNext(nx,next,r,ex.item.no);
    const why=$("#why"); if(why) why.onclick=()=>explain(ex,given,why);
  }
  function finish(){
    let pts=0; for(const x of S.results) pts += x.r==="ok"?1:x.r==="almost"?.5:0;
    const pct=Math.round(pts/S.results.length*100), g=gradeOf(pct);
    const p=getProg(state.topic); if(p[channel]==null||pct>p[channel]) p[channel]=pct; saveProg(state.topic,p);
    const mark={ok:"✓",almost:"½",no:"✗"};
    $("#side").innerHTML=`<div class="panel"><h4>Notenskala</h4>${scaleTable()}</div>`;
    $("#ex").innerHTML=`<div class="result-head"><div class="grade">${g}</div><div><span class="label">Ergebnis · ${channel==="written"?"schriftlich":"mündlich"}</span><h3 style="font-size:28px">${GRADE_TXT[g][0].toUpperCase()+GRADE_TXT[g].slice(1)}</h3><div class="muted">${pts} von ${S.results.length} Punkten · ${pct} %</div></div></div>
      <div class="review">${S.results.map(x=>`<div><span class="m ${x.r}">${mark[x.r]}</span><span><b>${esc(first(x.ex.item.no))}</b> – ${esc(x.ex.item.de)}${x.r!=="ok"&&x.given!=="(selbst bewertet)"?`<br><span class="muted">Deine Antwort: ${esc(x.given)}</span>`:""}</span></div>`).join("")}</div>
      <div class="row" style="margin-top:16px"><button class="btn red" id="again">Neuer Test</button><button class="btn" id="tr">Zum Training</button><button class="btn ai-only" id="adv">Lernplan von Ingrid</button></div><div id="advout"></div>`;
    $("#again").onclick=()=>runSession(pane,mode,channel);
    $("#tr").onclick=()=>{ state.tab=channel==="written"?"tw":"to"; renderTopic() };
    const adv=$("#adv"); if(adv) adv.onclick=async()=>{ adv.disabled=true; adv.classList.add("spin"); const out=$("#advout");
      const wrong=S.results.filter(x=>x.r!=="ok").map(x=>`${first(x.ex.item.no)} (${x.ex.item.de}) – Antwort: ${x.given}`).join("\n")||"keine";
      try{ await sample(`Du bist Ingrid, eine freundliche Norwegischlehrerin für Deutschsprachige. Ein Lernender (Niveau ${state.level}) hat einen ${channel==="written"?"schriftlichen":"mündlichen"} Test zum Thema „${topicMeta(state.topic).de}“ mit ${pct} % (norwegische Note ${g}) abgeschlossen.\nFehler:\n${wrong}\n\nGib auf Deutsch einen kurzen Lernplan: 1 Satz Lob, dann höchstens 3 konkrete Punkte, was zu üben ist (mit norwegischen Beispielen). Kein Markdown, keine Überschriften, max. 90 Wörter.`,{modelTier:"quick",onText:({text})=>{ out.innerHTML=`<div class="ai-out" style="margin-top:12px"></div>`; out.firstChild.textContent=text }}) }
      catch(e){ out.innerHTML=`<p class="note">${esc(aiErr(e))}</p>` } adv.classList.remove("spin") };
  }
}
async function explain(ex,given,btn){
  btn.disabled=true; btn.classList.add("spin"); const out=$("#aiex");
  try{
    await sample(`Du bist Ingrid, Norwegischlehrerin für Deutschsprachige (Niveau ${state.level}). Aufgabe: "${ex.label}". Norwegisch richtig: "${first(ex.item.no)}" (= "${ex.item.de}"). Antwort des Lernenden: "${given}".
Erkläre auf Deutsch in höchstens 3 kurzen Sätzen, was falsch war und gib eine Merkhilfe (z. B. Vergleich mit dem Deutschen, Aussprache, Grammatikregel). Kein Markdown.`,{modelTier:"quick",onText:({text})=>{ out.innerHTML='<div class="ai-out"></div>'; out.firstChild.textContent=text }});
  }catch(e){ out.innerHTML=`<p class="note">${esc(aiErr(e))}</p>` }
  btn.classList.remove("spin"); btn.hidden=true;
}

/* ---------------- Free writing (KI) ---------------- */
function renderFreeWrite(pane){
  const t=topicMeta(state.topic), set=getSet(state.topic,state.level);
  const hints = shuffle(set.v).slice(0,5).map(x=>first(x.no));
  pane.innerHTML=`<div class="stage"><div class="card">
    <span class="label">Freies Schreiben · ${esc(t.de)}</span>
